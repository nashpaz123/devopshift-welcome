# If Values.argoApplication.install is true, install the ArgoCD Application.
{{- if .Values.argoApplication.install }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookinfo-application
  namespace: argocd
spec:
  project: {{ .Values.argoApplication.project }}
  source:
    repoURL: '{{ .Values.argoApplication.repoURL }}'
    path: '{{ .Values.argoApplication.path }}'
    targetRevision: {{ .Values.argoApplication.targetRevision }}
  destination:
    server: {{ .Values.argoApplication.server }}
    namespace: {{ .Values.argoApplication.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration-hook
  annotations:
    # This annotation ensures this job runs before the application is synced
    argocd.argoproj.io/hook: PreSync
    # This specifies the wave order. Lower numbers are run first.
    argocd.argoproj.io/hook-wave: "0"
spec:
  template:
    spec:
      containers:
      - name: migration-container
        image: my-database-migration-image:v1
        command:
          - "/bin/sh"
          - "-c"
          - |
            echo "Running DB migration..."
            # Add your migration script or commands here
      restartPolicy: Never

{{- end }}

